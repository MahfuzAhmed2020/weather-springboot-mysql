spring.application.name=weather-api

# Load .env
spring.config.import=optional:file:.env[.properties]

# Weatherstack
weather.api.key=${WEATHER_API_KEY:demo-weather-api-key}

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/weatherdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Server
server.port=8080